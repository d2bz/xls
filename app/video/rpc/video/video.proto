// goctl rpc protoc video.proto --go_out=. --go-grpc_out=. --zrpc_out=.
syntax = "proto3";

package video;
option go_package="./video";

message Error {
  int32 code = 1;
  string message = 2;
}

message publishRequest {
  int32 uid = 1;
  string title = 2;
  string url = 3;
  repeated string tags = 4;
}

message publishResponse {
  Error error = 1;
  int32 videoID = 2;
}

message getVideoListRequest {
  repeated string videoIDs = 1;
}

message videoItem {
  int32 videoID = 1;
  int32 authorID = 2;
  string authorName = 3;
  string authorAvatar = 4;
  string title = 5;
  string url = 6;
  int32 likeNum = 7;
  int32 commentNum = 8;
  string createdAt = 9;
  repeated string tags = 10;
}

message getVideoListResponse {
  Error error = 1;
  repeated videoItem hotVideoList = 2;
}

message searchVideoRequest {
  string keyword = 1;
  int64 page = 2;
  int64 size = 3;
}

message searchVideoResponse {
  Error error = 1;
  int64 total = 2;
  repeated videoItem videos = 3;
}

message GetVideosByTagRequest {
  string tag = 1;
  int64 page = 2;
  int64 size = 3;
}

message GetVideosByTagResponse {
  Error error = 1;
  int64 total = 2;
  repeated videoItem videos = 3;
}

message GetVideosByTagsRequest {
  repeated string tags = 1;
  int64 page = 2;
  int64 size = 3;
}

message GetVideosByTagsResponse {
  Error error = 1;
  int64 total = 2;
  repeated videoItem videos = 3;
}

message Dimension {
  string name = 1;
  repeated string tags = 2;
  int32 weight = 3;
}

message GetVideosByDimensionsRequest {
  repeated Dimension dimensions = 1;
  int64 limit = 2;
  int64 page = 3;
}

message GetVideosByDimensionsResponse {
  Error error = 1;
  int64 total = 2;
  repeated videoItem videos = 3;
}

service Video {
  rpc Publish(publishRequest) returns (publishResponse);
  rpc GetVideoList(getVideoListRequest) returns (getVideoListResponse);
  rpc SearchVideo(searchVideoRequest) returns (searchVideoResponse);
  rpc GetVideosByDimensions(GetVideosByDimensionsRequest) returns (GetVideosByDimensionsResponse);
}
